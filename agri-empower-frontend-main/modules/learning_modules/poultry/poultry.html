<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Module</title>

    <!-- Optional CSS -->
    <link rel="stylesheet" href="poultry.css">
</head>
<body>

    <h1>Poultry Management</h1>

    <!-- Tabs -->
    <div class="tabs">
        <button onclick="showSection('broiler')">Broiler</button>
        <button onclick="showSection('layer')">Layer</button>
    </div>

    <!-- Dynamic Learning Content -->
    <div id="learning-content">
        <p>Select a section to begin learning.</p>
    </div>

    <!-- PDF Guide -->
    <h2>📘 Poultry Learning (Foundation Level)</h2>
    <a href="pdf/poultry-foundation-guide.pdf" target="_blank"></a>
        📄 Open Poultry Foundation Guide
    </a>

    <!-- Form (Admin / Data Entry) -->
    <h2>Add Poultry Record</h2>
    <form id="poultry-form">
        <input type="text" id="title" placeholder="Poultry Title" required />
        <br><br>

        <textarea id="description" placeholder="Description"></textarea>
        <br><br>

        <input type="text" id="feed" placeholder="Feed Type" />
        <br><br>

        <input type="text" id="market" placeholder="Market Info" />
        <br><br>

        <input type="text" id="image" placeholder="Image URL (optional)" />
        <br><br>

        <button type="submit">Add Poultry</button>
    </form>

    <hr>

    <!-- Data Display -->
    <h2>Available Poultry Records</h2>
    <div id="poultry-container">
        <p>Loading...</p>
    </div>

    <!-- JS File -->
    <script src="poultry.js"></script>

</body>
</html>
